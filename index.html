<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FlowPlan"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>FlowPlan</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a38;
    --accent: #c8f564;
    --accent2: #6b9fff;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --danger: #ff6b6b;
    --safe: env(safe-area-inset-top, 0px);
    --safeb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

  /* Layout */
  #app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe); }
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--accent); letter-spacing: -0.5px; }
  .header-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px; }
  .header-week { font-size: 12px; color: var(--muted); text-align: right; }
  .header-week strong { color: var(--text); display: block; font-size: 14px; }

  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    flex-shrink: 0; background: var(--surface);
  }
  .tab {
    flex: 1; padding: 12px 0; font-size: 12px; text-align: center;
    color: var(--muted); cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 500; transition: color 0.2s;
    border: none; background: none; -webkit-appearance: none;
  }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

  .view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* Week view */
  .week-header {
    padding: 20px 20px 12px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .week-title { font-family: 'DM Serif Display', serif; font-size: 26px; }
  .week-badge {
    font-size: 10px; background: var(--surface2); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 20px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase;
  }

  .day-card {
    margin: 0 16px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .day-card.rest { opacity: 0.5; }
  .day-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .day-name { font-size: 13px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .day-type { font-size: 16px; font-weight: 400; color: var(--text); }
  .day-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
  }
  .day-dot.strength { background: #ff9f6b; }
  .day-dot.mobility { background: var(--accent); }
  .day-dot.recovery { background: var(--accent2); }
  .day-dot.rest { background: var(--border); }

  .exercise-list { padding: 4px 0; }
  .exercise-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none; color: inherit;
  }
  .exercise-item:last-child { border-bottom: none; }
  .exercise-item:active { background: var(--surface2); }
  .ex-done { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; cursor: pointer; }
  .ex-done.checked { background: var(--accent); border-color: var(--accent); }
  .ex-done.checked::after { content: '✓'; font-size: 11px; color: #000; font-weight: 700; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .ex-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .ex-creator { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent2); margin-top: 4px; }
  .ex-link { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; font-size: 14px; }

  .generate-btn {
    margin: 16px; padding: 14px;
    background: var(--accent); color: #000;
    border: none; border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer; width: calc(100% - 32px);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity 0.2s, transform 0.1s;
    -webkit-appearance: none;
  }
  .generate-btn:active { transform: scale(0.98); opacity: 0.9; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Loading state */
  .loading-wrap { padding: 40px 20px; text-align: center; }
  .loader { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--muted); }
  .loading-sub { font-size: 12px; color: var(--muted); margin-top: 6px; opacity: 0.6; }

  /* Creators view */
  .creators-header { padding: 20px 20px 12px; }
  .creators-title { font-family: 'DM Serif Display', serif; font-size: 26px; }
  .creators-count { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .creator-card {
    margin: 0 16px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .creator-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    border: 1.5px solid var(--border);
  }
  .creator-info { flex: 1; min-width: 0; }
  .creator-handle { font-size: 14px; font-weight: 500; }
  .creator-type { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .creator-remove { width: 28px; height: 28px; border-radius: 50%; background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-appearance: none; }

  .add-creator-section { padding: 8px 16px 16px; }
  .add-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
  .add-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
    outline: none; -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  .add-input:focus { border-color: var(--accent2); }
  .add-input::placeholder { color: var(--muted); }
  .add-btn {
    margin-top: 10px; width: 100%; padding: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    cursor: pointer; -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  .add-btn:active { border-color: var(--accent2); }

  /* Progress view */
  .progress-header { padding: 20px 20px 12px; }
  .progress-title { font-family: 'DM Serif Display', serif; font-size: 26px; }
  .progress-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .month-grid { padding: 0 16px 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .month-cell {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 10px;
    text-align: center; cursor: pointer;
    transition: border-color 0.2s;
  }
  .month-cell.current { border-color: var(--accent); }
  .month-cell.past { opacity: 0.6; }
  .month-cell-name { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .month-cell-phase { font-size: 10px; color: var(--accent2); margin-top: 4px; }
  .month-cell-pct { font-size: 20px; font-family: 'DM Serif Display', serif; margin-top: 4px; color: var(--text); }

  .phase-detail { margin: 0 16px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .phase-name { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--accent); }
  .phase-desc { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .phase-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .phase-tag { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

  /* Empty state */
  .empty-state { padding: 48px 20px; text-align: center; }
  .empty-icon { font-size: 40px; margin-bottom: 16px; }
  .empty-title { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 8px; }
  .empty-text { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 280px; margin: 0 auto; }

  /* Nav bottom */
  .bottom-nav {
    display: flex; border-top: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
    padding-bottom: var(--safeb);
  }
  .nav-btn {
    flex: 1; padding: 10px 0; display: flex; flex-direction: column;
    align-items: center; gap: 3px; cursor: pointer;
    background: none; border: none; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 10px;
    letter-spacing: 0.05em; text-transform: uppercase;
    transition: color 0.2s; -webkit-appearance: none;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 20px; line-height: 1; }

  /* Toast */
  .toast {
    position: fixed; bottom: calc(80px + var(--safeb)); left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; color: var(--text);
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  .view::-webkit-scrollbar { width: 0; }

  .divider { height: 1px; background: var(--border); margin: 4px 16px 12px; }
  .section-label { padding: 12px 20px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div>
      <div class="header-logo">FlowPlan</div>
      <div class="header-sub">AI Workout Scheduler</div>
    </div>
    <div class="header-week" id="weekDisplay"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('week')">Week</button>
    <button class="tab" onclick="switchTab('progress')">Year</button>
    <button class="tab" onclick="switchTab('creators')">Creators</button>
    <button class="tab" onclick="switchTab('settings')">Settings</button>
  </div>

  <div class="view" id="viewWeek">
    <div id="weekContent"></div>
  </div>

  <div class="view" id="viewProgress" style="display:none">
    <div id="progressContent"></div>
  </div>

  <div class="view" id="viewCreators" style="display:none">
    <div id="creatorsContent"></div>
  </div>

  <div class="view" id="viewSettings" style="display:none">
    <div id="settingsContent"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="navWeek" onclick="switchTab('week')">
      <span class="nav-icon">📅</span>Week
    </button>
    <button class="nav-btn" id="navProgress" onclick="switchTab('progress')">
      <span class="nav-icon">📈</span>Year
    </button>
    <button class="nav-btn" id="navCreators" onclick="switchTab('creators')">
      <span class="nav-icon">👤</span>Creators
    </button>
    <button class="nav-btn" id="navSettings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span>Settings
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const DEFAULT_CREATORS = [
  { handle: 'shainamarie.b', type: 'Functional Strength', emoji: '💪', url: 'https://www.instagram.com/shainamarie.b' },
  { handle: 'promethia_yoga', type: 'Yoga / Flow', emoji: '🧘', url: 'https://www.instagram.com/promethia_yoga' },
  { handle: 'greymoving', type: 'Movement / Functional', emoji: '🌀', url: 'https://www.instagram.com/greymoving' },
  { handle: 'djkim.yoga', type: 'Yoga Expert', emoji: '🧘', url: 'https://www.instagram.com/djkim.yoga' },
  { handle: 'madeformefitness', type: 'Corrective Exercise / PT', emoji: '🏋️', url: 'https://www.instagram.com/madeformefitness' },
  { handle: 'r.a_movement', type: 'Movement Training', emoji: '🌀', url: 'https://www.instagram.com/r.a_movement' },
  { handle: 'nina_raimanova', type: 'Home Fitness', emoji: '🏃', url: 'https://www.instagram.com/nina_raimanova' },
  { handle: 'meldeetz', type: 'Home Fitness', emoji: '🏃', url: 'https://www.instagram.com/meldeetz' },
  { handle: 'yogiissy', type: 'Yoga', emoji: '🧘', url: 'https://www.instagram.com/yogiissy' },
  { handle: 'deeisaud', type: 'Fitness', emoji: '💪', url: 'https://www.instagram.com/deeisaud' },
  { handle: 'paradigmofperfection', type: 'Fitness', emoji: '🏋️', url: 'https://www.instagram.com/paradigmofperfection' },
  { handle: 'kickassyoga', type: 'Yoga / Strength', emoji: '🧘', url: 'https://www.instagram.com/kickassyoga' },
  { handle: 'zubalenok', type: 'Yoga / Flexibility', emoji: '🤸', url: 'https://www.instagram.com/zubalenok' },
  { handle: 'dina.dobrofit', type: 'Home Fitness', emoji: '🏃', url: 'https://www.instagram.com/dina.dobrofit' },
  { handle: 'squat_university', type: 'Mobility / Rehab', emoji: '🔬', url: 'https://www.instagram.com/squat_university' },
  { handle: 'dr.jenny.pt', type: 'Physical Therapy', emoji: '🩺', url: 'https://www.instagram.com/dr.jenny.pt' },
  { handle: 'yogawithanjaly', type: 'Yoga', emoji: '🧘', url: 'https://www.instagram.com/yogawithanjaly' },
  { handle: 'back_painfix', type: 'Back Pain / Rehab', emoji: '🩺', url: 'https://www.instagram.com/back_painfix' },
  { handle: 'bellababefit', type: 'Home Strength', emoji: '💪', url: 'https://www.instagram.com/bellababefit' },
  { handle: 'elizabethaylorfitness', type: 'Fitness', emoji: '🏋️', url: 'https://www.instagram.com/elizabethaylorfitness' },
  { handle: 'painacademy', type: 'Pain Rehab', emoji: '🩺', url: 'https://www.instagram.com/painacademy' },
  { handle: 'movementbydavid', type: 'Movement', emoji: '🌀', url: 'https://www.instagram.com/movementbydavid' },
  { handle: 'flowwithadee', type: 'Yoga Flow', emoji: '🧘', url: 'https://www.instagram.com/flowwithadee' },
];

const YEAR_PHASES = [
  { months: [1,2], name: 'Foundation', color: '#6b9fff', desc: 'Build baseline mobility and movement patterns. Focus on corrective work, joint health, and gentle strength activation. 3 days/week.' },
  { months: [3,4], name: 'Awakening', color: '#c8f564', desc: 'Introduce consistent strength training. Mix yoga flows with bodyweight circuits. Begin progressive overload with home exercises.' },
  { months: [5,6], name: 'Build', color: '#ffb56b', desc: 'Increase workout intensity and complexity. Add HIIT elements. Deeper mobility work alongside functional strength.' },
  { months: [7,8], name: 'Peak', color: '#ff6b9d', desc: 'Highest intensity phase. Full-body strength, cardio conditioning, advanced yoga poses. Track progress closely.' },
  { months: [9,10], name: 'Refine', color: '#c8f564', desc: 'Maintain strength gains while improving technique and form. Introduce more varied movement styles.' },
  { months: [11,12], name: 'Restore', color: '#6b9fff', desc: 'Deload and recovery. Prioritize mobility, flexibility, and yoga. Reflect and prep for next year cycle.' },
];

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_TYPES = ['strength','rest','mobility','rest','strength','mobility','rest'];

let state = {
  creators: [...DEFAULT_CREATORS],
  weekPlan: null,
  completedExercises: {},
  currentWeek: getCurrentWeek(),
  generatingWeek: false,
  apiKey: '',
};

// Load saved state
try {
  const saved = localStorage.getItem('flowplan_state');
  if (saved) {
    const parsed = JSON.parse(saved);
    state.creators = parsed.creators || state.creators;
    state.weekPlan = parsed.weekPlan || null;
    state.completedExercises = parsed.completedExercises || {};
    state.apiKey = parsed.apiKey || '';
  }
} catch(e) {}

function save() {
  try { localStorage.setItem('flowplan_state', JSON.stringify(state)); } catch(e) {}
}

function getCurrentWeek() {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay() + 1);
  return start.toISOString().split('T')[0];
}

function getPhaseForMonth(month) {
  return YEAR_PHASES.find(p => p.months.includes(month)) || YEAR_PHASES[0];
}

// ── UI Helpers ───────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

function switchTab(tab) {
  ['week','progress','creators','settings'].forEach((t, i) => {
    const viewEl = document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1));
    const navEl = document.getElementById('nav' + t.charAt(0).toUpperCase() + t.slice(1));
    const tabEl = document.querySelectorAll('.tab')[i];
    if (viewEl) viewEl.style.display = t === tab ? 'block' : 'none';
    if (navEl) navEl.classList.toggle('active', t === tab);
    if (tabEl) tabEl.classList.toggle('active', t === tab);
  });
  if (tab === 'creators') renderCreators();
  if (tab === 'progress') renderProgress();
  if (tab === 'settings') renderSettings();
}

function renderSettings() {
  const hasKey = !!state.apiKey;
  const masked = hasKey ? '••••••••' + state.apiKey.slice(-4) : '';
  document.getElementById('settingsContent').innerHTML = `
    <div class="creators-header">
      <div class="creators-title">Settings</div>
      <div class="creators-count">Configure your AI connection</div>
    </div>
    <div class="add-creator-section">
      <div class="add-label">Google Gemini API Key</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6">
        Get your key at <a href="https://aistudio.google.com" target="_blank" style="color:var(--accent2)">aistudio.google.com</a>. 
        It's stored only on your device.
      </p>
      ${hasKey ? `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:8px">
        Current key: <span style="color:var(--accent)">${masked}</span>
      </div>` : ''}
      <input class="add-input" id="apiKeyInput" type="password" placeholder="AIza..." />
      <button class="add-btn" style="margin-top:10px" onclick="saveApiKey()">
        ${hasKey ? '↺ Update API Key' : '+ Save API Key'}
      </button>
      ${hasKey ? `<button class="add-btn" style="margin-top:8px;color:var(--danger);border-color:var(--danger)22" onclick="clearApiKey()">✕ Remove Key</button>` : ''}
    </div>
    <div class="divider"></div>
    <div class="add-creator-section">
      <div class="add-label">How it works</div>
      <p style="font-size:13px;color:var(--muted);line-height:1.7">
        FlowPlan calls the Claude API directly from your device using your key. 
        Your key is saved locally in your browser — never sent anywhere except Google.
        Free tier — no credit card needed.
      </p>
    </div>
  `;
}

function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val || val.length < 10) { toast('Please enter a valid API key'); return; }
  state.apiKey = val;
  save();
  toast('API key saved ✓');
  renderSettings();
}

function clearApiKey() {
  state.apiKey = '';
  save();
  toast('Key removed');
  renderSettings();
}

// ── Week View ────────────────────────────────────────────────────────────────
function renderWeek() {
  const now = new Date();
  document.getElementById('weekDisplay').innerHTML = `
    <strong>Week ${getWeekNumber(now)}, ${now.getFullYear()}</strong>
    ${MONTH_NAMES[now.getMonth()]} ${now.getDate()}
  `;

  const container = document.getElementById('weekContent');

  if (state.generatingWeek) {
    container.innerHTML = `
      <div class="loading-wrap">
        <div class="loader"></div>
        <div class="loading-text">Generating your week…</div>
        <div class="loading-sub">Analyzing ${state.creators.length} creators & current phase</div>
      </div>`;
    return;
  }

  if (!state.weekPlan) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✨</div>
        <div class="empty-title">Ready to plan your week?</div>
        <div class="empty-text">AI will build a 3-day schedule from your ${state.creators.length} creators, matched to your current training phase.</div>
      </div>
      <button class="generate-btn" onclick="generateWeek()">✦ Generate This Week's Plan</button>`;
    return;
  }

  let html = `<div class="week-header"><span class="week-title">This Week</span><span class="week-badge">${state.weekPlan.phase}</span></div>`;

  DAYS.forEach((day, i) => {
    const type = DAY_TYPES[i];
    const dayData = state.weekPlan.days && state.weekPlan.days[i];

    if (type === 'rest' || !dayData) {
      html += `<div class="day-card rest">
        <div class="day-header">
          <div><div class="day-name">${day}</div><div class="day-type" style="color:var(--muted)">Rest & Recovery</div></div>
          <div class="day-dot rest"></div>
        </div>
      </div>`;
      return;
    }

    const dotClass = type;
    html += `<div class="day-card">
      <div class="day-header">
        <div><div class="day-name">${day}</div><div class="day-type">${dayData.focus || ''}</div></div>
        <div class="day-dot ${dotClass}"></div>
      </div>
      <div class="exercise-list">`;

    (dayData.exercises || []).forEach((ex, ei) => {
      const key = `${i}-${ei}`;
      const done = state.completedExercises[key];
      const igUrl = ex.creatorUrl || `https://www.instagram.com/${ex.creator}/`;
      html += `<div class="exercise-item">
        <div class="ex-done ${done ? 'checked' : ''}" onclick="toggleDone('${key}', event)"></div>
        <div class="ex-info">
          <div class="ex-name" style="${done ? 'text-decoration:line-through;opacity:0.5' : ''}">${ex.name}</div>
          <div class="ex-meta">${ex.duration || ''} · ${ex.reps || ''}</div>
          <span class="ex-creator" style="cursor:pointer" onclick="event.stopPropagation();window.open('${igUrl}','_blank')"><span>📸</span> @${ex.creator} ↗</span>
        </div>
        ${ex.videoUrl ? `<a class="ex-link" href="${ex.videoUrl}" target="_blank" onclick="event.stopPropagation()">▶</a>` : ''}
      </div>`;
    });

    html += `</div></div>`;
  });

  html += `<button class="generate-btn" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);margin-top:4px" onclick="generateWeek()">↺ Regenerate Week</button>`;
  html += `<div style="height:20px"></div>`;

  container.innerHTML = html;
}

function toggleDone(key, e) {
  e.stopPropagation();
  state.completedExercises[key] = !state.completedExercises[key];
  save();
  renderWeek();
}

// ── AI Generation ────────────────────────────────────────────────────────────
async function generateWeek() {
  state.generatingWeek = true;
  renderWeek();

  const now = new Date();
  const phase = getPhaseForMonth(now.getMonth() + 1);
  const creatorList = state.creators.map(c => `@${c.handle} (${c.type})`).join(', ');

  const prompt = `You are a fitness coach building a weekly workout plan. 

Current training phase: ${phase.name} — ${phase.desc}
User goals: mobility, home-based strength, weight loss, 3 days/week (Mon, Wed, Sat)
Creators available: ${creatorList}

Generate a weekly plan for Monday, Wednesday, and Saturday. Each day needs 4-5 exercises.
For each exercise include:
- name: specific exercise name (e.g. "Hip 90/90 Stretch", "Glute Bridge Pulses")
- duration: time or sets/reps (e.g. "3×12" or "45 sec")
- reps: additional detail if needed
- creator: exact Instagram handle from the list (no @ sign) most associated with this type of exercise
- focus: day focus title

Assign creators intelligently:
- Mobility/flexibility exercises → djkim.yoga, squat_university, promethia_yoga, r.a_movement, flowwithadee, yogawithanjaly, yogiissy
- Strength/bodyweight → shainamarie.b, madeformefitness, bellababefit, meldeetz, nina_raimanova
- Pain/corrective → dr.jenny.pt, back_painfix, painacademy, squat_university
- Movement flows → greymoving, movementbydavid, r.a_movement

Return ONLY valid JSON, no markdown, no explanation:
{
  "phase": "${phase.name}",
  "days": [
    {
      "dayIndex": 0,
      "focus": "Day title",
      "exercises": [
        { "name": "Exercise Name", "duration": "3×10", "reps": "each side", "creator": "handle" }
      ]
    },
    { "dayIndex": 2, "focus": "...", "exercises": [...] },
    { "dayIndex": 5, "focus": "...", "exercises": [...] }
  ]
}`;

  if (!state.apiKey) {
    state.generatingWeek = false;
    switchTab('settings');
    toast('Add your Gemini API key first ↓');
    return;
  }

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${state.apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { maxOutputTokens: 1000 }
      })
    });

    const data = await res.json();
    const text = data.candidates[0].content.parts[0].text;
    const clean = text.replace(/```json|```/g, '').trim();
    const plan = JSON.parse(clean);

    // Normalize to 7-day array
    const days = new Array(7).fill(null);
    (plan.days || []).forEach(d => {
      days[d.dayIndex] = d;
      // Attach creator URLs
      (d.exercises || []).forEach(ex => {
        const c = state.creators.find(cr => cr.handle === ex.creator);
        ex.creatorUrl = c ? c.url : `https://www.instagram.com/${ex.creator}`;
      });
    });
    plan.days = days;

    state.weekPlan = plan;
    state.completedExercises = {};
    save();
  } catch (err) {
    toast('Generation failed — try again');
    console.error(err);
  }

  state.generatingWeek = false;
  renderWeek();
}

// ── Progress View ────────────────────────────────────────────────────────────
function renderProgress() {
  const now = new Date();
  const currentMonth = now.getMonth() + 1;

  let html = `<div class="progress-header">
    <div class="progress-title">Year Plan</div>
    <div class="progress-sub">6 progressive training phases</div>
  </div>`;

  const currentPhase = getPhaseForMonth(currentMonth);
  html += `<div class="phase-detail">
    <div class="phase-name">Now: ${currentPhase.name} Phase</div>
    <div class="phase-desc">${currentPhase.desc}</div>
    <div class="phase-tags">`;
  currentPhase.months.forEach(m => {
    html += `<span class="phase-tag">${MONTH_NAMES[m-1]}</span>`;
  });
  html += `</div></div>`;

  html += `<div class="section-label">All 12 Months</div>`;
  html += `<div class="month-grid">`;
  for (let m = 1; m <= 12; m++) {
    const phase = getPhaseForMonth(m);
    const isCurrent = m === currentMonth;
    const isPast = m < currentMonth;
    html += `<div class="month-cell ${isCurrent ? 'current' : ''} ${isPast ? 'past' : ''}">
      <div class="month-cell-name">${MONTH_NAMES[m-1]}</div>
      <div class="month-cell-phase" style="color:${phase.color}">${phase.name}</div>
    </div>`;
  }
  html += `</div>`;

  html += `<div class="section-label">All Phases</div>`;
  YEAR_PHASES.forEach(p => {
    html += `<div class="phase-detail" style="margin-bottom:10px;border-color:${p.color}22">
      <div class="phase-name" style="color:${p.color}">${p.name}</div>
      <div class="phase-desc">${p.desc}</div>
      <div class="phase-tags">`;
    p.months.forEach(m => {
      html += `<span class="phase-tag">${MONTH_NAMES[m-1]}</span>`;
    });
    html += `</div></div>`;
  });
  html += `<div style="height:20px"></div>`;

  document.getElementById('progressContent').innerHTML = html;
}

// ── Creators View ────────────────────────────────────────────────────────────
function renderCreators() {
  let html = `<div class="creators-header">
    <div class="creators-title">Creators</div>
    <div class="creators-count">${state.creators.length} sources in your plan</div>
  </div>`;

  state.creators.forEach((c, i) => {
    html += `<div class="creator-card">
      <div class="creator-avatar">${c.emoji}</div>
      <div class="creator-info" style="cursor:pointer" onclick="window.open('${c.url}','_blank')">
        <div class="creator-handle" style="color:var(--accent2)">@${c.handle} ↗</div>
        <div class="creator-type">${c.type}</div>
      </div>
      <button class="creator-remove" onclick="removeCreator(${i})">×</button>
    </div>`;
  });

  html += `<div class="add-creator-section">
    <div class="add-label">Add a creator</div>
    <input class="add-input" id="addInput" placeholder="Instagram URL or @handle" />
    <button class="add-btn" onclick="addCreator()">+ Add to Plan</button>
  </div>`;
  html += `<div style="height:20px"></div>`;

  document.getElementById('creatorsContent').innerHTML = html;
}

function removeCreator(i) {
  state.creators.splice(i, 1);
  state.weekPlan = null;
  save();
  renderCreators();
  toast('Creator removed — regenerate your week');
}

function addCreator() {
  const input = document.getElementById('addInput');
  let raw = input.value.trim();
  if (!raw) return;

  // Extract handle from URL or @handle
  let handle = raw;
  const urlMatch = raw.match(/instagram\.com\/([^/?#]+)/);
  if (urlMatch) handle = urlMatch[1];
  handle = handle.replace(/^@/, '').split('?')[0];

  if (!handle) { toast('Invalid URL or handle'); return; }
  if (state.creators.find(c => c.handle === handle)) { toast('Already in your plan'); return; }

  state.creators.push({
    handle,
    type: 'Fitness Creator',
    emoji: '⭐',
    url: `https://www.instagram.com/${handle}`
  });
  state.weekPlan = null;
  save();
  input.value = '';
  renderCreators();
  toast(`@${handle} added — regenerate your week`);
}

// ── Utils ────────────────────────────────────────────────────────────────────
function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

// ── Service Worker ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Init ─────────────────────────────────────────────────────────────────────
renderWeek();
</script>
